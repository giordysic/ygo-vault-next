plugins { id 'com.android.application' }

android {
    namespace 'com.nettuno.assedio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nettuno.assedio.final'
        minSdk 24
        targetSdk 35
        versionCode 120
        versionName '1.2.0'
    }

    buildTypes {
        debug { debuggable false }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}