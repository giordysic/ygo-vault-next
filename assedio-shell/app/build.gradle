plugins { id 'com.android.application' }

android {
    namespace 'com.nettuno.assedio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nettuno.assedio.final'
        minSdk 24
        targetSdk 35
        versionCode 141
        versionName '1.4.1'
    }

    buildTypes {
        debug { debuggable false }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// ASSEDIO 1.4.1 shell; reliable menu input, visible discards, CPU Extreme.
