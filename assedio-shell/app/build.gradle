plugins { id 'com.android.application' }

android {
    namespace 'com.nettuno.assedio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nettuno.assedio.final'
        minSdk 24
        targetSdk 35
        versionCode 131
        versionName '1.3.1'
    }

    buildTypes {
        debug { debuggable false }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// ASSEDIO 1.3.1 shell; full game assets are packaged before final signing.
