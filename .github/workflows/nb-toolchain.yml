name: Nothing Browser Toolchain

on:
  push:
    branches:
      - build/nothing-browser-toolchain
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Install Android API 36 build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Package Android build toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp "$ANDROID_HOME/platforms/android-36/android.jar" out/android-36.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/aapt2" out/aapt2
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" out/zipalign
          cp "$ANDROID_HOME/build-tools/36.0.0/lib64/libc++.so" out/libc++.so
          chmod +x out/aapt2 out/zipalign
          curl --fail --location --retry 4 --retry-delay 2 \
            -o out/r8-8.3.37.jar \
            https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.3.37/r8-8.3.37.jar
          curl --fail --location --retry 4 --retry-delay 2 \
            -o out/apksig-8.3.2.jar \
            https://dl.google.com/dl/android/maven2/com/android/tools/build/apksig/8.3.2/apksig-8.3.2.jar
          curl --fail --location --retry 4 --retry-delay 2 \
            -o out/gson-2.10.1.jar \
            https://repo1.maven.org/maven2/com/google/code/gson/gson/2.10.1/gson-2.10.1.jar
          sha256sum out/* > out/SHA256SUMS.txt
          java -cp out/r8-8.3.37.jar com.android.tools.r8.D8 --version
          out/aapt2 version
          LD_LIBRARY_PATH="$ANDROID_HOME/build-tools/36.0.0/lib64" out/zipalign -h >/dev/null
      - name: Upload toolchain
        uses: actions/upload-artifact@v4
        with:
          name: nothing-browser-full-toolchain-3.3
          path: out/
          if-no-files-found: error
          retention-days: 1
