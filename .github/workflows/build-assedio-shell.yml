name: Build ASSEDIO Shell APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: assedio-shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify shell APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ASSEDIO-SHELL-10.0.5.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs ASSEDIO-SHELL-10.0.5.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging ASSEDIO-SHELL-10.0.5.apk | tee apk-badging.txt
          grep -q "package: name='com.nettuno.assedio'" apk-badging.txt
          grep -q "versionCode='15'" apk-badging.txt
          grep -q "versionName='10.0.5'" apk-badging.txt
          unzip -t ASSEDIO-SHELL-10.0.5.apk
      - name: Package Android signing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libc++1 libc++abi1 libunwind-18
          mkdir -p android-signing-tools
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" android-signing-tools/
          cp "$ZIPALIGN" android-signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt" android-signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" android-signing-tools/
          for LIB_NAME in 'libc++.so' 'libc++abi.so.1' 'libunwind.so.1'; do
            LIB_PATH="$(ldd "$ZIPALIGN" | awk -v name="$LIB_NAME" '$1==name {print $3; exit}')"
            test -n "$LIB_PATH"
            test -f "$LIB_PATH"
            cp -L "$LIB_PATH" "android-signing-tools/$LIB_NAME"
          done
          chmod +x android-signing-tools/apksigner android-signing-tools/zipalign android-signing-tools/aapt
          LD_LIBRARY_PATH="$PWD/android-signing-tools" android-signing-tools/zipalign -h >/dev/null 2>&1 || true
          tar -czf android-signing-tools-linux.tar.gz android-signing-tools
      - uses: actions/upload-artifact@v4
        with:
          name: ASSEDIO-SHELL-APK
          path: |
            assedio-shell/ASSEDIO-SHELL-10.0.5.apk
            assedio-shell/apk-badging.txt
            assedio-shell/android-signing-tools-linux.tar.gz
          if-no-files-found: error
          retention-days: 30