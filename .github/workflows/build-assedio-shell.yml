name: Build ASSEDIO Shell APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: assedio-shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify shell APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ASSEDIO-SHELL-10.0.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs ASSEDIO-SHELL-10.0.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging ASSEDIO-SHELL-10.0.0.apk | tee apk-badging.txt
          grep -q "package: name='com.nettuno.assedio'" apk-badging.txt
          grep -q "versionName='10.0.0'" apk-badging.txt
          unzip -t ASSEDIO-SHELL-10.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ASSEDIO-SHELL-APK
          path: |
            assedio-shell/ASSEDIO-SHELL-10.0.0.apk
            assedio-shell/apk-badging.txt
          if-no-files-found: error
          retention-days: 30
