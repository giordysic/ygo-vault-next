name: Build DETOX BioSafe Launcher APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: detox-launcher
    steps:
      - uses: actions/checkout@v4
      - name: Restore Android project
        run: |
          cat project-bundle/part* > project.b64
          base64 --decode project.b64 > project.tar.gz
          gzip -t project.tar.gz
          tar -xzf project.tar.gz
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/res/values/strings.xml')
          s = p.read_text(encoding='utf-8')
          if 'accessibility_service_description' not in s:
              s = s.replace('</resources>', '    <string name="accessibility_service_description">Controllo BioSafe delle app e del tempo schermo</string>\n</resources>')
              p.write_text(s, encoding='utf-8')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: |
          set +e
          gradle --no-daemon --console=plain :app:assembleDebug > build.log 2>&1
          code=$?
          tail -n 180 build.log
          exit $code
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DETOX-BIOSAFE-BUILD-DIAGNOSTICS
          path: detox-launcher/build.log
          if-no-files-found: warn
          retention-days: 7
      - name: Verify APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DETOX-BIOSAFE-LAUNCHER-1.1.0.apk
          sha256sum DETOX-BIOSAFE-LAUNCHER-1.1.0.apk > DETOX-BIOSAFE-LAUNCHER-1.1.0.apk.sha256
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs DETOX-BIOSAFE-LAUNCHER-1.1.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging DETOX-BIOSAFE-LAUNCHER-1.1.0.apk | tee apk-badging.txt
          grep -q "package: name='com.nettuno.detoxlauncher'" apk-badging.txt
          grep -q "versionName='1.1.0'" apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree DETOX-BIOSAFE-LAUNCHER-1.1.0.apk AndroidManifest.xml | grep -q 'android.intent.category.HOME'
          unzip -t DETOX-BIOSAFE-LAUNCHER-1.1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DETOX-BIOSAFE-LAUNCHER-APK
          path: |
            detox-launcher/DETOX-BIOSAFE-LAUNCHER-1.1.0.apk
            detox-launcher/DETOX-BIOSAFE-LAUNCHER-1.1.0.apk.sha256
          if-no-files-found: error
          retention-days: 30
